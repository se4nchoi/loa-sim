<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<link rel="icon" href="data:,">
<title>loa-sim</title>
<style>
html { background: oklch(14.5% 0 0); color-scheme: dark; }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; font-family: ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif; color: oklch(91% 0 0); }
main { display: flex; flex-direction: column; align-items: center; gap: 22px; padding: 24px; text-align: center; }
.brand { font-size: 15px; font-weight: 700; color: oklch(72% 0 0); letter-spacing: 0.01em; }
.spin { width: 140px; height: 140px; box-sizing: border-box; border-radius: 50%; border: 11px solid oklch(32% 0 0); border-top-color: oklch(72.3% 0.15 293.69); animation: spin 0.8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .spin { animation-duration: 2.4s; } }
h1 { margin: 0; font-size: 24px; font-weight: 700; }
h1 a { color: oklch(80.28% 0.105 295.74); text-decoration: none; }
#s { margin: 0; min-height: 1.4em; font-size: 14px; color: oklch(62% 0 0); }
</style>
</head>
<body>
<main>
<div class="brand">loa-sim</div>
<div class="spin" role="progressbar" aria-label="Moving"></div>
<h1>Moving to <a href="https://loa-sim.pages.dev/">loa-sim.pages.dev</a></h1>
<p id="s"></p>
</main>
<script>
// Receives a visitor's saved data from the old site (loa-sim.vercel.app; see vercel-moved/index.html; served at /migrate/), in chunks
// carried in the URL hash. Fills only keys this browser doesn't have yet, once, then hands back to the old site so
// it stops sending. Any failure just opens the app.
(async () => {
	const OLD = 'https://loa-sim.vercel.app';
	const status = (t) => { const el = document.getElementById('s'); if (el) el.textContent = t; };
	const DONE = 'loa-sim:imported';
	const BUF = 'loa-sim:import-buffer';
	const h = new URLSearchParams(location.hash.slice(1));
	const safe = (p) => (p && p[0] === '/' && p[1] !== '/' && p[1] !== '\\' ? p : '/');
	const to = safe(h.get('to'));
	// Arrivals from the old address, for the "moved" bar (src/lib/MovedNotice.svelte).
	try { localStorage.setItem('loa-sim:arrived-from-old', String(Date.now())); } catch {}
	if (h.get('lsm') === 'arrive') return location.replace(to);
	const back = (q) => location.replace(OLD + '/#' + new URLSearchParams({ lsm: q.lsm, ...(q.part != null ? { part: q.part } : {}), to }));
	try {
		if (!document.referrer.startsWith(OLD + '/')) return location.replace(to);
		if (localStorage.getItem(DONE)) return back({ lsm: 'done' });
		const n = Number(h.get('n')), of = Number(h.get('of')), len = Number(h.get('len')), d = h.get('d') ?? '';
		if (!(n >= 0 && n < of && len > 0)) return location.replace(to);
		status(`Moving your saved data · ${n + 1}/${of}`);
		const prev = n === 0 ? { len, data: '' } : JSON.parse(sessionStorage.getItem(BUF) ?? 'null');
		if (!prev || prev.len !== len) return location.replace(to);
		const data = prev.data + d;
		if (n + 1 < of) {
			sessionStorage.setItem(BUF, JSON.stringify({ len, data }));
			return back({ lsm: 'part', part: n + 1 });
		}
		sessionStorage.removeItem(BUF);
		if (data.length !== len) return location.replace(to);
		const bytes = Uint8Array.from(atob(data.slice(1).replace(/-/g, '+').replace(/_/g, '/')), (c) => c.charCodeAt(0));
		const stream = new Blob([bytes]).stream();
		const json = await new Response(data[0] === 'z' ? stream.pipeThrough(new DecompressionStream('deflate-raw')) : stream).text();
		const entries = JSON.parse(json);
		for (const [k, v] of Object.entries(entries)) {
			if (/^loa-(sim|eff):/.test(k) && typeof v === 'string' && localStorage.getItem(k) === null) localStorage.setItem(k, v);
		}
		localStorage.setItem(DONE, '1');
		back({ lsm: 'done' });
	} catch {
		location.replace(to);
	}
})();
</script>
</body>
</html>
